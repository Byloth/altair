[package]
name = "altair-runtime"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "altair-run"
path = "src/main.rs"

[dependencies]
altair-pe = { path = "../pe" }
altair-shader = { path = "../shader" }
altair-bink = { path = "../bink" }
altair-forge = { path = "../forge" }
wgpu = "24"
pollster = "0.4"
png = "0.17"
winit = "0.30"

# Linux only: memory, signals, library loading (see src/host.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
